# Ambiente local de produto: app (gunicorn) + Postgres.
# Sobe com:  docker compose up --build
# Acesso:    http://localhost:8000/anaplan/

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: anaplan
      POSTGRES_USER: anaplan
      POSTGRES_PASSWORD: anaplan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anaplan"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn anaplan.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "dev-compose-insecure-CHANGE-ME"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgres://anaplan:anaplan@db:5432/anaplan"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
